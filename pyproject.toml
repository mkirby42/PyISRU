[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyisru"
version = "0.1.0"
description = "ISRU simulations and app"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
  "pytest==8.0.0",
  "pytest-cov==4.0.0",
  "pytest-mock==3.12.0",
  "pytest-xdist==3.5.0",
]

[tool.setuptools]
packages = ["pyisru"]
package-dir = {"pyisru" = "src"}


