{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="post-grid">
    {% for post in posts %}
    {% if post.get('is_app') %}
        <a href="{{ post.app_url }}" class="post-card app-card">
    {% elif post.medium_link %}
        <a href="{{ post.medium_link }}" target="_blank" class="post-card">
    {% else %}
        <a href="{{ url_for('post', filename=post.filename) }}" class="post-card">
    {% endif %}
        {% if post.image %}
        <div class="post-image">
            <img 
                alt="{{ post.title }}"
                loading="lazy"
                src="{{ url_for('thumb') }}?src={{ post.image }}&w=480"
                srcset="{{ url_for('thumb') }}?src={{ post.image }}&w=360 360w, {{ url_for('thumb') }}?src={{ post.image }}&w=480 480w, {{ url_for('thumb') }}?src={{ post.image }}&w=720 720w"
                sizes="(max-width: 600px) 100vw, 480px">
        </div>
        {% endif %}
        <div class="post-info">
            <h2>{{ post.title }}</h2>
            <p>{{ post.description }}</p>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
