{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="post-grid">
    {% for post in posts %}
    {% if post.get('is_app') %}
        <a href="{{ post.app_url }}" class="post-card app-card">
    {% elif post.medium_link %}
        <a href="{{ post.medium_link }}" target="_blank" class="post-card">
    {% else %}
        <a href="{{ url_for('post', filename=post.filename) }}" class="post-card">
    {% endif %}
        {% if post.image %}
        <div class="post-image">
            <img src="{{ url_for('static', filename='images/' + post.image) }}" alt="{{ post.title }}">
        </div>
        {% endif %}
        <div class="post-info">
            <h2>{{ post.title }}</h2>
            <p>{{ post.description }}</p>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
