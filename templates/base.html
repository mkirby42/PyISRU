<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mars ISRU Mission Control{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if not request.endpoint == 'dashboard' %}
    <header>
        <h1><a href="{{ url_for('index') }}">Weapons Grade Bolognium</a></h1>
        <p class="subtitle"><a href="{{ url_for('index') }}">by Mathew Kirby</a></p>
    </header>
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
