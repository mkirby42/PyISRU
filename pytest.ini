[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Add options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra

# Test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    slow: Slow-running tests (use -m "not slow" to skip)
    simulation: Full simulation tests
    power: Power system tests
    materials: Material flow tests
    environment: Environmental condition tests
    debug: Debug and diagnostic tests

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for long-running tests (in seconds)
timeout = 300

# Parallel execution settings
# Run with: pytest -n auto
# Or: pytest -n 4 (for 4 processes)

# Coverage settings (if using pytest-cov)
# Run with: pytest --cov=src --cov-report=html 